version: "3.9"

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./emotion_system/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_PATH=/data/emotion_system.db
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - db_data:/data                          # persistent SQLite storage
      - ./emotion_system/student_photos:/app/../student_photos:ro
    labels:
      - "traefik.enable=false"                 # backend is internal only
    networks:
      - internal

  # ── React Frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./Ddownloadedusense-web/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edusense.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.edusense.entrypoints=websecure"
      - "traefik.http.routers.edusense.tls.certresolver=letsencrypt"
      # Redirect HTTP → HTTPS
      - "traefik.http.routers.edusense-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.edusense-http.entrypoints=web"
      - "traefik.http.routers.edusense-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
    networks:
      - internal
      - traefik_proxy

  # ── Traefik Reverse Proxy + Auto SSL ────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik_proxy

volumes:
  db_data:
  letsencrypt:

networks:
  internal:
  traefik_proxy:
    external: false
