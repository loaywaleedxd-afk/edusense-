version: "3.9"

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-edusense}
      POSTGRES_USER:     ${POSTGRES_USER:-edusense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edusense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./emotion_system/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-edusense}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edusense}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://${DOMAIN}}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - ./emotion_system/student_photos:/app/student_photos:ro
    labels:
      - "traefik.enable=false"                 # backend is internal; nginx proxies /api/*
    networks:
      - internal

  # ── React Frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./Ddownloadedusense-web/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edusense.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.edusense.entrypoints=websecure"
      - "traefik.http.routers.edusense.tls.certresolver=letsencrypt"
      # Redirect HTTP → HTTPS
      - "traefik.http.routers.edusense-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.edusense-http.entrypoints=web"
      - "traefik.http.routers.edusense-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
    networks:
      - internal
      - traefik_proxy

  # ── Traefik Reverse Proxy + Auto SSL ────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik_proxy

volumes:
  pg_data:
  letsencrypt:

networks:
  internal:
  traefik_proxy:
    external: false
