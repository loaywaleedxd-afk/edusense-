version: "3.9"
# ── IP-only deployment (no domain / no SSL) ───────────────────────────────────
# Use this when you don't have a domain yet:
#   docker compose -f docker-compose.ip.yml up -d
# Access the app at: http://<your-vps-ip>

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-edusense}
      POSTGRES_USER:     ${POSTGRES_USER:-edusense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EduSense2026!}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edusense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./emotion_system/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-edusense}:${POSTGRES_PASSWORD:-EduSense2026!}@db:5432/${POSTGRES_DB:-edusense}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ALLOWED_ORIGINS=*
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - ./emotion_system/student_photos:/app/student_photos:ro
    networks:
      - internal

  # ── React Frontend (nginx on port 80) ────────────────────────────────────────
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Ddownloadedusense-web/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - internal

volumes:
  pg_data:

networks:
  internal:
