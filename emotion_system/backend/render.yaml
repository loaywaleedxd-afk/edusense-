services:
  - type: web
    name: edusense-backend
    runtime: python
    rootDir: emotion_system/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /opt/render/project/src/edusense.db
      - key: ALLOWED_ORIGINS
        value: https://edusense.hostinger.com,http://localhost:5173
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /api/health
