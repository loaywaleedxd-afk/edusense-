<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Graduation cap body (mortarboard base) -->
  <ellipse cx="256" cy="240" rx="140" ry="38" fill="url(#cap)"/>

  <!-- Cap top board -->
  <polygon points="256,148 396,220 256,252 116,220" fill="#6d28d9"/>
  <polygon points="256,148 396,220 256,252 116,220" fill="url(#cap)" opacity="0.85"/>

  <!-- Cap center highlight -->
  <ellipse cx="256" cy="200" rx="28" ry="14" fill="#a78bfa" opacity="0.6"/>

  <!-- Tassel string -->
  <line x1="396" y1="220" x2="396" y2="300" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="396" cy="308" r="14" fill="#f59e0b"/>
  <rect x="390" y="308" width="12" height="28" rx="4" fill="#f59e0b" opacity="0.7"/>

  <!-- Diploma scroll below -->
  <rect x="166" y="310" width="180" height="90" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="3"/>
  <rect x="166" y="310" width="180" height="22" rx="14" fill="#3b82f6" opacity="0.5"/>

  <!-- Diploma lines -->
  <rect x="192" y="344" width="128" height="6" rx="3" fill="#60a5fa" opacity="0.6"/>
  <rect x="204" y="358" width="104" height="5" rx="2" fill="#60a5fa" opacity="0.4"/>
  <rect x="216" y="371" width="80" height="5" rx="2" fill="#60a5fa" opacity="0.3"/>

  <!-- Sparkle top left -->
  <circle cx="130" cy="160" r="6" fill="#a78bfa" opacity="0.7"/>
  <circle cx="148" cy="140" r="3" fill="#7c3aed" opacity="0.5"/>

  <!-- Sparkle top right -->
  <circle cx="380" cy="155" r="5" fill="#3b82f6" opacity="0.7"/>
  <circle cx="364" cy="138" r="3" fill="#60a5fa" opacity="0.5"/>
</svg>
